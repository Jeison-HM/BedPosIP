[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proyectogrado"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cmake==3.28.3",
    "hgq2>=0.1.8",
    "hls4ml>=1.3.0",
    "keras>=3.14.0",
    "keras-tuner>=1.4.8",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "tensorboard>=2.20.0",
    "tensorflow[and-cuda]>=2.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
