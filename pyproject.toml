[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bedposip"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cmake==3.28.3",
    "graphviz>=0.21",
    "hgq2>=0.1.8",
    "hls4ml[profiling, hgq2] @ git+https://github.com/Jeison-HM/hls4ml.git@VitisUnifiedClean",
    "ipykernel>=7.2.0",
    "keras>=3.14.0",
    "keras-tuner>=1.4.8",
    "matplotlib>=3.10.8",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "numpy>=2.4.3",
    "pandas>=3.0.2",
    "pydot>=4.0.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "setuptools>=82.0.1",
    "tensorflow-model-optimization>=0.8.1",
    "tensorflow[and-cuda]>=2.21.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"pipeline/scripts/06_infer_bitstream.py" = ["E402", "I001"]
